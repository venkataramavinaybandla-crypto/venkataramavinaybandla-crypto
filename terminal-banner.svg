<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131a2a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="50%" stop-color="#8b7dff"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
    <style>
      .term { font-family: 'Consolas', 'SFMono-Regular', 'Menlo', 'Monaco', monospace; }
      .prompt { fill: #7ee787; }
      .cmd { fill: #e6edf3; }
      .out { fill: #9ba7c0; }
      .accent { fill: #a5a5ff; }
      .win { fill: #f2c94c; }
    </style>
  </defs>

  <!-- outer glow border -->
  <rect x="1" y="1" width="798" height="338" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.8"/>

  <!-- window body -->
  <rect x="4" y="4" width="792" height="332" rx="12" fill="url(#bgGrad)"/>

  <!-- title bar -->
  <rect x="4" y="4" width="792" height="34" rx="12" fill="#161b22"/>
  <rect x="4" y="22" width="792" height="16" fill="#161b22"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="21" r="6" fill="#27c93f"/>
  <text x="400" y="26" text-anchor="middle" class="term out" font-size="12">vinay@kl-university: ~</text>

  <!-- terminal content -->
  <g class="term" font-size="15">
    <text x="26" y="72"><tspan class="prompt">$</tspan> <tspan class="cmd">whoami</tspan></text>
    <text x="26" y="96" class="out">vinay_bandla — B.Tech CSE (AI/ML), KL University Hyderabad</text>

    <text x="26" y="132"><tspan class="prompt">$</tspan> <tspan class="cmd">cat mission.txt</tspan></text>
    <text x="26" y="156" class="out">Not chasing frameworks. Chasing the math underneath them.</text>
    <text x="26" y="176" class="out">Target: AI Research Scientist @ a frontier lab.</text>
    <text x="26" y="196" class="accent">Status: still building the foundation to get there.</text>

    <text x="26" y="232"><tspan class="prompt">$</tspan> <tspan class="cmd">git log --oneline -3</tspan></text>
    <text x="26" y="256" class="out">a3f9c2e  fix: platform bugs across 5 extraction targets</text>
    <text x="26" y="276" class="out">7b1e0d4  test: 319/319 passing on citation engine</text>
    <text x="26" y="296" class="out">2c4a891  feat: lost-and-found tracker w/ CLIP embeddings</text>

    <text x="26" y="322"><tspan class="prompt">$</tspan></text>
  </g>

  <!-- blinking cursor block -->
  <rect x="52" y="309" width="10" height="16" class="cmd" fill="#e6edf3">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
